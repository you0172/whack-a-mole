<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Whack-a-Mole — a polished, accessible browser game built with TypeScript. 60 seconds, combos, golden moles and bombs."
    />
    <meta name="theme-color" content="#0f2027" />

    <meta property="og:title" content="Whack-a-Mole" />
    <meta
      property="og:description"
      content="60 seconds. Nine holes. Combos, golden moles and bombs. An accessible whack-a-mole built with TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Whack-a-Mole — 60 seconds of reflex</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="brand">
          <span class="brand__mark" aria-hidden="true">🔨</span>
          <span class="brand__text">Whack<span class="brand__accent">-a-</span>Mole</span>
        </h1>
        <div class="topbar__actions">
          <button
            id="sound-toggle"
            class="icon-btn"
            type="button"
            aria-pressed="true"
            aria-label="Mute sound"
          >
            <span aria-hidden="true">🔊</span>
          </button>
          <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause game" disabled>
            <span aria-hidden="true">⏸</span>
          </button>
        </div>
      </header>

      <main class="stage">
        <section class="hud" aria-label="Game status">
          <div class="hud__item">
            <span class="hud__label">Score</span>
            <span class="hud__value" id="score" aria-live="off">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">Combo</span>
            <span class="hud__value" id="combo">x1</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">Level</span>
            <span class="hud__value" id="level">1</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">Best</span>
            <span class="hud__value" id="best">0</span>
          </div>
        </section>

        <div class="timer" role="timer" aria-label="Time remaining">
          <div class="timer__track">
            <div class="timer__fill" id="timer-fill"></div>
          </div>
          <span class="timer__value" id="timer-value">60</span>
        </div>

        <div class="board-wrap">
          <div id="board" class="board" role="group" aria-label="Whack-a-mole board, 9 holes">
            <!-- holes injected -->
          </div>

          <div id="overlay" class="overlay" hidden>
            <div class="overlay__card">
              <p class="overlay__eyebrow" id="overlay-eyebrow">Ready?</p>
              <h2 class="overlay__title" id="overlay-title">Whack every mole</h2>
              <p class="overlay__body" id="overlay-body">
                Click or tap a mole. Use keys <kbd>1</kbd>–<kbd>9</kbd> for the keyboard.
              </p>
              <div class="overlay__stats" id="overlay-stats" hidden></div>
              <button id="overlay-action" class="btn btn--primary" type="button">Start game</button>
            </div>
          </div>
        </div>

        <p class="hint">
          <kbd>1</kbd>–<kbd>9</kbd> to whack · <kbd>P</kbd> pause · <kbd>R</kbd> restart
        </p>

        <p class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></p>
      </main>

      <footer class="footer">
        <span>Built with TypeScript · No assets · MIT licensed</span>
        <a href="https://github.com/you0172/whack-a-mole" rel="noreferrer noopener">Source</a>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
